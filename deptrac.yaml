deptrac:
  paths:
    - ./src

  layers:
    # Module layers, matched across every module: App\<Module>\<Layer>\...
    - name: Controller
      collectors:
        - type: classLike
          value: '^App\\[A-Za-z0-9]+\\Controller\\.*'

    - name: Application
      collectors:
        - type: classLike
          value: '^App\\[A-Za-z0-9]+\\Service\\.*'

    - name: Domain
      collectors:
        - type: classLike
          value: '^App\\[A-Za-z0-9]+\\Domain\\.*'

    - name: Infrastructure
      collectors:
        - type: classLike
          value: '^App\\[A-Za-z0-9]+\\Infrastructure\\.*'

    # Request-scoped middleware that has to ask a module something. The
    # §10.6 context chain resolves identity by composing modules; the rate
    # limiter has to reach storage to count. Neither belongs in SharedHttp,
    # which must stay transport-only, and both need exactly this ruleset —
    # so they share a layer rather than each getting one.
    - name: Context
      collectors:
        - type: classLike
          value: '^App\\Shared\\(Context|Throttle)\\.*'

    # Shared platform code.
    - name: SharedHttp
      collectors:
        - type: classLike
          value: '^App\\Shared\\Http\\.*'

    # Money joined the kernel on 2026-10-26: five modules priced with
    # `Billing\Domain\Money`, which made Billing a dependency of everything
    # that names an amount.
    - name: SharedKernel
      collectors:
        - type: classLike
          value: '^App\\Shared\\(Exceptions|Logging|Money|Validation)\\.*'

    # Persistence helpers. Its own layer so the domain cannot reach it: an
    # unassigned namespace is governed by no rule at all, which is how a
    # Domain -> SQL dependency would sneak back in through a helper.
    - name: SharedDatabase
      collectors:
        - type: classLike
          value: '^App\\Shared\\Database\\.*'

    # External concerns, so the forbidden edges of §37.6 are expressible.
    - name: Sql
      collectors:
        - type: classLike
          value: '^(PDO|PDOStatement|Doctrine\\DBAL\\.*)$'

    - name: Http
      collectors:
        - type: classLike
          value: '^(Psr\\Http\\.*|Laminas\\Diactoros\\.*|Laminas\\HttpHandlerRunner\\.*)$'
    # A provider SDK. Its own layer so that the one place allowed to know
    # Stripe's shape is the adapter (ADR-048): a `Stripe\` import in a
    # service, a controller or the domain is the PSP leaking upward, which is
    # what non-negotiable #17 and the PaymentProvider port exist to prevent.
    - name: Stripe
      collectors:
        - type: classLike
          value: '^Stripe\\.*'

  ruleset:
    # Controllers are thin: HTTP in, application service out. Never SQL.
    # They may read the resolved context, which is the only sanctioned source
    # of tenant and product identity.
    # Domain is allowed for the types a presenter turns into JSON. Behaviour
    # still goes through Application: a controller that reached a Repository
    # directly would be orchestrating, which is the service layer's job.
    Controller:
      - Application
      - Context
      - Domain
      - SharedHttp
      - SharedKernel
      - Http

    # The context chain composes modules to resolve who is asking, as what.
    # Nothing depends on it except controllers, so the direction stays one-way.
    Context:
      - Application
      - Domain
      - SharedKernel
      - Http

    # Application services orchestrate use cases.
    Application:
      - Domain
      - SharedKernel

    # Domain holds business invariants and depends on nothing technical.
    # No Http and no Sql here — those are the two explicit bans in §37.6.
    Domain:
      - SharedKernel

    # Infrastructure adapts external providers and maps the domain onto
    # storage (the Postgres repositories live here); may speak HTTP and SQL.
    # A separate Repository layer matched `App\<Module>\Repository\*`, a
    # namespace no class has ever used, and was removed on 2026-10-26.
    Infrastructure:
      - Domain
      - SharedKernel
      - SharedDatabase
      - Sql
      - Http
      - Stripe

    SharedHttp:
      - SharedKernel
      - Http

    SharedDatabase:
      - SharedKernel
      - Sql

    # The kernel is the bottom of the graph.
    SharedKernel: ~
