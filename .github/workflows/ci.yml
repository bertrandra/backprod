name: CI

on:
  push:
    branches: [main]
  pull_request:

# One run per branch at a time (2026-09-20). A push that lands while the
# previous one is still running makes that run's answer about a commit nobody
# will merge, so it is cancelled — on `main` too, where the newer push carries
# the older one anyway. This is where most of a month's minutes went: a fix
# pushed ten minutes after the PR opened cost two full runs, not one.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Architecture V2 §37.13 lists the full gate chain for the platform. Both halves
# are here now: `quality-gates` runs the PHP chain, `frontend` runs ESLint,
# TypeScript, Vitest, the generated-client check and Playwright.
#
# The two jobs are separate rather than sequential. They share only
# `openapi.json` — the frontend regenerates from it to prove its client is not
# stale — and neither needs the other's toolchain, so running them in parallel
# means a lint error surfaces without waiting for a database to start.
#
# §37.13 is explicit that a failing step means "PR = NOT READY", so nothing
# below is allowed to continue-on-error.
#
# What is allowed is not running a job that could not fail (2026-09-20). A
# pull request that touches only the PHP side cannot break ESLint or a
# Playwright spec; one that touches only prose cannot break anything a gate
# measures. `changes` says which halves moved and the jobs below read it —
# on a pull request only: a push to `main` runs everything, because that is
# the run a deployment is built from. Skipping is not the same as passing:
# a skipped job reports nothing, so `gh pr checks` is empty rather than green,
# and a PR that changed nothing measurable merges on that emptiness knowingly.

jobs:
  changes:
    name: What moved
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            # Anything a PHP gate can see. Prose is out; the coverage map is
            # not prose, gate:ui reads it, and it lives under docs/ — so it
            # is named back in through `frontend` below.
            code:
              - '**'
              - '!**/*.md'
              - '!docs/**'
            # Anything the frontend job can see, including the contract it
            # regenerates from and the map gate:screens checks it against.
            frontend:
              - 'frontend/**'
              - 'openapi.json'
              - 'docs/ui-api-coverage.json'

  quality-gates:
    name: Quality gates
    runs-on: ubuntu-latest
    needs: changes
    # The PHP chain also reads the frontend (gate:screens, gate:permissions),
    # so it runs for either half.
    if: github.event_name == 'push' || needs.changes.outputs.code == 'true' || needs.changes.outputs.frontend == 'true'

    # A real PostgreSQL, not a substitute. The repository adapters exist to
    # run SQL, and the tenant isolation they enforce is only meaningfully
    # tested against the database that will enforce it in production.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: backprod
          POSTGRES_PASSWORD: backprod
          POSTGRES_DB: backprod_test
        ports:
          - 5432:5432
        # -U matters: without it pg_isready connects as the runner's OS user,
        # which has no role, and the server logs a FATAL for every probe.
        options: >-
          --health-cmd "pg_isready -U backprod -d backprod_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_DSN: postgresql://backprod:backprod@127.0.0.1:5432/backprod_test

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: gd, json, mbstring, pdo, pdo_pgsql
          # No coverage driver: nothing in this repository collects coverage,
          # and Xdebug taxes every line of every PHP process it is loaded
          # into. It was costing the whole gate chain for a report nobody
          # asks for.
          coverage: none
          tools: none

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      # This database exists for the length of one job and is thrown away.
      # Durability after a crash is worth nothing here, and it is most of what
      # the suite spends its time on: every test resets state with a single
      # TRUNCATE of ~40 tables, and TRUNCATE's cost is the fsync of the new
      # relation files at commit. Measured against a real PostgreSQL 16, 200
      # of this suite's own resets take 16.5s durable and 5.6s here — and
      # synchronous_commit alone changes nothing, because the flush being
      # waited on is the file's, not the WAL's.
      #
      # Nothing about what the tests prove changes. The same PostgreSQL
      # enforces the same constraints, triggers, foreign keys and isolation
      # predicates; only its promise to survive losing power does not.
      - name: Trade durability for speed on the throwaway database
        env:
          PGPASSWORD: backprod
        run: |
          psql -h 127.0.0.1 -U backprod -d backprod_test \
            -c "ALTER SYSTEM SET fsync = off" \
            -c "ALTER SYSTEM SET full_page_writes = off" \
            -c "ALTER SYSTEM SET synchronous_commit = off" \
            -c "SELECT pg_reload_conf()"
          psql -h 127.0.0.1 -U backprod -d backprod_test -c "SHOW fsync"

      # Migrations run before the tests that read the schema they create, and
      # running them here also proves each one applies to an empty database.
      - name: Migrate
        run: composer run migrate

      # First, and cheap. Everything below is a step that must exist, and this
      # is what notices when one does not: `gate:screens` was in the chain and
      # missing here for a whole milestone, passing locally and running in CI
      # zero times. A chain nobody verifies against this file is two lists that
      # drift, and the drift is invisible in exactly the direction that matters.
      - name: CI runs every gate in the chain
        run: composer run gate:ci

      - name: Coding standards
        run: composer run cs

      - name: Static analysis
        run: composer run stan

      - name: Architecture rules
        run: composer run deptrac

      # Proves the architecture gate actually rejects a violation, rather
      # than passing because it silently stopped inspecting anything.
      - name: Architecture gate is enforced
        run: composer run gate:proof

      # §12.1 bans branching on a product's identity; the architecture gate
      # cannot see a string comparison, so it is checked separately.
      - name: No product-specific branching
        run: composer run gate:products

      # §13 bans rights expressed as plan-name checks. Same reasoning as the
      # gate above, and verified to fail on a deliberate violation before it
      # was trusted here.
      - name: No plan-name branching
        run: composer run gate:plans

      # §13 bans rights scattered through the code. gate:plans catches the
      # loud shape; this catches the quiet one — a controller that injects
      # the entitlement machinery and reasons about it itself (R4).
      - name: Entitlement decisions have one door
        run: composer run gate:entitlements

      # CLAUDE.md opens the per-endpoint loop with "Update OpenAPI —
      # contract first, always", and §37.16 will not call a feature done
      # without it. A contract nothing checks drifts within a milestone and
      # is then worse than none, because it is believed.
      - name: The contract describes the API
        run: composer run gate:openapi

      # The contract gate above checks the contract against the *router*, so an
      # endpoint can be served, documented and reachable by nobody. This checks
      # it against docs/ui-api-coverage.json: every operation has a screen area
      # or a written reason for having none, and no area claims an operation
      # that no longer exists.
      - name: Every operation is reachable in the UI
        run: composer run gate:ui

      # gate:ui proves the coverage map adds up and says outright that it "does
      # not prove a screen was built". This checks the map against the frontend:
      # every area has a route in the router, every operation it claims is called
      # through the generated client — matched by the contract's method and path,
      # not by name — and nothing calls an operation no area claims.
      - name: Screens call the operations they claim
        run: composer run gate:screens

      # The frontend decides what to offer from permission strings, which makes
      # those strings load-bearing data. Six of the first sixteen were wrong and
      # every frontend test still passed, because they exercised the mechanism
      # against fixtures the same file invented.
      - name: The frontend gates on permissions that exist
        run: composer run gate:permissions

      # U6's rule, made mechanical. "No optimistic mutation anywhere in this
      # milestone" was a paragraph in a docblock, which is the same kind of
      # promise the six wrong permission codes were. Issuing an invoice
      # allocates a gapless legal number, and a screen that assumed success
      # would have invented a document nobody can find.
      - name: No mutation that moves money is optimistic
        run: composer run gate:money

      # The time bound lives here, on the step, rather than in Composer's
      # 300-second default for the subprocesses it spawns. That default is
      # sized for downloading packages, and when the suite crossed it the job
      # failed with a process-timeout stack trace that named neither a test
      # nor a failure. A suite that genuinely hangs still fails — loudly, and
      # in the step that owns it.
      - name: Tests
        timeout-minutes: 10
        env:
          COMPOSER_PROCESS_TIMEOUT: 0
        run: composer run test

  frontend:
    name: Frontend gates
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.frontend == 'true'

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      # Before lint and typecheck, deliberately. If the contract moved and the
      # committed client did not follow, every error the other steps report is
      # about a stale shape and sends the reader looking in the wrong place.
      # This step names the real cause first.
      - name: The generated client matches the contract
        run: npm run gate:client

      - name: ESLint
        run: npm run lint

      - name: TypeScript
        run: npm run typecheck

      - name: Vitest
        run: npm run test

      # One build, and it is the production one — no test values baked in.
      #
      # U11 needed a second, `--mode e2e` build here: the application has a gate
      # above the router and renders nothing without a token, and the suite
      # needed a bundle that knew about an identity provider to get past it.
      # Since U12 the fixture in e2e/support/app.ts stubs the session at the
      # browser level (`page.route('**/api/v1/auth/refresh', ...)`), the same way
      # every other API call in these specs is stubbed — so the bundle Playwright
      # serves needs nothing baked in either, and there is only one build to run.
      - name: Build
        run: npx vite build

      # The browser itself is the same bytes run after run; only the system
      # packages the next step installs are not cached. Keyed on the lock
      # file, because that is where the Playwright version lives.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Desktop and mobile, because docs/ui-roadmap.md says mobile is not a
      # milestone and a suite that only ran at desktop width would make that
      # promise decorative.
      - name: Playwright
        run: npm run e2e

  # --- The deployable bundle ------------------------------------------------
  #
  # A bundle nobody has served is the same kind of object as a backup nobody has
  # restored. Every ingredient above can be green while the *assembly* is wrong:
  # the application one directory from where the shim looks, an asset the entry
  # document names and the archive does not carry, a Content-Security-Policy that
  # refuses the very origin the browser must reach.
  #
  # So CI builds one and interrogates it over HTTP. Its own limits are stated in
  # bin/verify-dist.sh: this is not Apache, and the host's PHP extensions and cron
  # are outside its reach.
  dist:
    name: Deployable bundle
    runs-on: ubuntu-latest
    needs: changes
    # Builds both halves, so it runs when either moved.
    if: github.event_name == 'push' || needs.changes.outputs.code == 'true' || needs.changes.outputs.frontend == 'true'

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: backprod
          POSTGRES_PASSWORD: backprod
          POSTGRES_DB: backprod_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U backprod -d backprod_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_DSN: postgresql://backprod:backprod@127.0.0.1:5432/backprod_test

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: gd, json, mbstring, pdo, pdo_pgsql
          coverage: none

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Migrate
        run: composer run migrate

      # `--skip-gates` because the frontend job above has already run every one
      # of them, and running them twice buys nothing but minutes.
      #
      # No identity provider to stub: bin/verify-dist.sh's authenticated check
      # is `GET /api/v1/me` over curl, answered 401 by the API itself rather than
      # a browser session, so this is the one bundle U12 ever builds — the same
      # one a deployment ships.
      - name: Build the bundle
        env:
          DEFAULT_PRODUCT: atlas
        run: bin/build-dist.sh --skip-gates

      # With DATABASE_DSN set, so the API half is exercised rather than only the
      # 503 an unconfigured deployment answers with.
      - name: Verify it serves
        run: bin/verify-dist.sh dist/bundle
