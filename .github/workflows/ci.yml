name: CI

on:
  push:
    branches: [main]
  pull_request:

# Architecture V2 §37.13 lists the full gate chain for the platform. The
# frontend steps (ESLint, Prettier, dependency-cruiser, Vitest, Playwright)
# are not represented here because this repository currently holds only the
# PHP backend; they join this workflow when the frontend lands.
#
# §37.13 is explicit that a failing step means "PR = NOT READY", so nothing
# below is allowed to continue-on-error.

jobs:
  quality-gates:
    name: Quality gates
    runs-on: ubuntu-latest

    # A real PostgreSQL, not a substitute. The repository adapters exist to
    # run SQL, and the tenant isolation they enforce is only meaningfully
    # tested against the database that will enforce it in production.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: backprod
          POSTGRES_PASSWORD: backprod
          POSTGRES_DB: backprod_test
        ports:
          - 5432:5432
        # -U matters: without it pg_isready connects as the runner's OS user,
        # which has no role, and the server logs a FATAL for every probe.
        options: >-
          --health-cmd "pg_isready -U backprod -d backprod_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_DSN: postgresql://backprod:backprod@127.0.0.1:5432/backprod_test

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: json, mbstring, pdo, pdo_pgsql
          # No coverage driver: nothing in this repository collects coverage,
          # and Xdebug taxes every line of every PHP process it is loaded
          # into. It was costing the whole gate chain for a report nobody
          # asks for.
          coverage: none
          tools: none

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      # This database exists for the length of one job and is thrown away.
      # Durability after a crash is worth nothing here, and it is most of what
      # the suite spends its time on: every test resets state with a single
      # TRUNCATE of ~40 tables, and TRUNCATE's cost is the fsync of the new
      # relation files at commit. Measured against a real PostgreSQL 16, 200
      # of this suite's own resets take 16.5s durable and 5.6s here — and
      # synchronous_commit alone changes nothing, because the flush being
      # waited on is the file's, not the WAL's.
      #
      # Nothing about what the tests prove changes. The same PostgreSQL
      # enforces the same constraints, triggers, foreign keys and isolation
      # predicates; only its promise to survive losing power does not.
      - name: Trade durability for speed on the throwaway database
        env:
          PGPASSWORD: backprod
        run: |
          psql -h 127.0.0.1 -U backprod -d backprod_test \
            -c "ALTER SYSTEM SET fsync = off" \
            -c "ALTER SYSTEM SET full_page_writes = off" \
            -c "ALTER SYSTEM SET synchronous_commit = off" \
            -c "SELECT pg_reload_conf()"
          psql -h 127.0.0.1 -U backprod -d backprod_test -c "SHOW fsync"

      # Migrations run before the tests that read the schema they create, and
      # running them here also proves each one applies to an empty database.
      - name: Migrate
        run: composer run migrate

      - name: Coding standards
        run: composer run cs

      - name: Static analysis
        run: composer run stan

      - name: Architecture rules
        run: composer run deptrac

      # Proves the architecture gate actually rejects a violation, rather
      # than passing because it silently stopped inspecting anything.
      - name: Architecture gate is enforced
        run: composer run gate:proof

      # §12.1 bans branching on a product's identity; the architecture gate
      # cannot see a string comparison, so it is checked separately.
      - name: No product-specific branching
        run: composer run gate:products

      # §13 bans rights expressed as plan-name checks. Same reasoning as the
      # gate above, and verified to fail on a deliberate violation before it
      # was trusted here.
      - name: No plan-name branching
        run: composer run gate:plans

      # The time bound lives here, on the step, rather than in Composer's
      # 300-second default for the subprocesses it spawns. That default is
      # sized for downloading packages, and when the suite crossed it the job
      # failed with a process-timeout stack trace that named neither a test
      # nor a failure. A suite that genuinely hangs still fails — loudly, and
      # in the step that owns it.
      - name: Tests
        timeout-minutes: 10
        env:
          COMPOSER_PROCESS_TIMEOUT: 0
        run: composer run test
